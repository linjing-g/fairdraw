
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal Section Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .font-bungee {
            font-family: 'Bungee', cursive;
        }

        .active-group-glow {
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.15), 0 0 0 2px rgba(79, 70, 229, 0.5);
        }

        .wheel-container {
            perspective: 1000px;
        }

        /* Smoother, longer transition for a more comfortable feel */
        .spin-transition {
            transition: transform 6s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .glass-card {
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        @keyframes result-bounce {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-result {
            animation: result-bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes win-shimmer {
            0% { text-shadow: 0 0 10px rgba(255,255,255,0); }
            50% { text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 30px currentColor; }
            100% { text-shadow: 0 0 10px rgba(255,255,255,0); }
        }
        .animate-shimmer {
            animation: win-shimmer 2s infinite ease-in-out;
        }

        @keyframes bg-flash {
            0% { background-color: rgba(255,255,255,0); }
            10% { background-color: rgba(255,255,255,0.4); }
            100% { background-color: rgba(255,255,255,0); }
        }
        .flash-overlay {
            animation: bg-flash 1s ease-out forwards;
        }
    </style>
<script type="importmap">

</html>
